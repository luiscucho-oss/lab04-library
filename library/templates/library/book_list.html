<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca - Libros</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 900px; margin: 0 auto; padding: 20px; }
        .book { border: 1px solid #ddd; padding: 15px; margin: 10px 0; border-radius: 5px; }
        .book h2 { margin-top: 0; }
        .meta { color: #666; font-size: 0.9em; }
        a { color: #0066cc; }
    </style>
</head>
<body>
    <h1>Catalogo de Libros</h1>
    {% for book in books %}
    <div class="book">
        <h2><a href="{% url 'library:book_detail' book.pk %}">{{ book.title }}</a></h2>
        <p class="meta">Autor: {{ book.author }} | ISBN: {{ book.isbn }} | {{ book.pages }} paginas</p>
        <p class="meta">Categorias: {% for cat in book.categories.all %}{{ cat }}{% if not forloop.last %}, {% endif %}{% endfor %}</p>
    </div>
    {% endfor %}
</body>
</html>
